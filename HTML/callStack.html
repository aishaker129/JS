<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Call Stack in JavaScript</h1>

    <script>

        function first(){
            second();
            console.log("Hello, this is first function");
        }

        function second(){
            third();
            console.log("Hello, this is second function");
        }

        function third(){
            console.log("Hello, this is third function");
        }

        first();
    </script>
</body>
</html>
