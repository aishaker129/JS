<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debounce</title>
</head>
<body>
    <h1>Debounce in JS</h1>
    <input type="text" onkeypress="handleSearch()" placeholder="Search here..." id="searchInput">

    <script>
        let timer;

        function callAPI(){
            console.log("API Callncalled");
        }
        function handleSearch(){
            clearTimeout(timer)
            timer = setTimeout(()=>{
                callAPI();
            },1000)
        }
    </script>
</body>
</html>
